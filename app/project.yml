# XcodeGen spec for MOVA. On a Mac:  brew install xcodegen && cd app && xcodegen && open MOVA.xcodeproj
name: MOVA
options:
  bundleIdPrefix: space.playlocal
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set your team in Xcode to run on a device
packages:
  MovaCore:
    path: Packages/MovaCore
  PhosphorSwift:
    url: https://github.com/phosphor-icons/swift
    from: "2.1.0"
targets:
  MOVA:
    type: application
    platform: iOS
    sources:
      - path: MOVA
    dependencies:
      - package: MovaCore
      - package: PhosphorSwift
    info:
      path: MOVA/Info.plist
      properties:
        CFBundleDisplayName: MOVA
        UILaunchScreen:
          UIColorName: Ink
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - BricolageGrotesque.ttf
          - DMMono-Regular.ttf
          - DMMono-Medium.ttf
        NSCameraUsageDescription: MOVA uses the camera to record each shot while it coaches your framing.
        NSMicrophoneUsageDescription: MOVA records sound with your video so your take keeps its audio.
        NSPhotoLibraryUsageDescription: Pick clips and photos to recreate or edit.
        NSPhotoLibraryAddUsageDescription: MOVA saves your finished videos to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: space.playlocal.mova
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  MOVATests:
    type: bundle.unit-test
    platform: iOS
    sources: [MOVATests]
    dependencies:
      - target: MOVA
schemes:
  MOVA:
    build:
      targets:
        MOVA: all
        MOVATests: [test]
    test:
      targets: [MOVATests]
