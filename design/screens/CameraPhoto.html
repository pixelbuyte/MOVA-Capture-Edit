<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera — Photo</title>
<link rel="stylesheet" href="../mova.css">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}</style>
<div class="scr" style="background: #000">
  <img src="../assets/img/port_denim.jpg" alt="Live preview: portrait in denim jacket" style="position: absolute; left: 0; top: 0; width: 390px; height: 700px; object-fit: cover">
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 700px; background-image: linear-gradient(90deg, transparent 129px, rgba(255,255,255,.22) 129px, rgba(255,255,255,.22) 130px, transparent 130px, transparent 259px, rgba(255,255,255,.22) 259px, rgba(255,255,255,.22) 260px, transparent 260px), linear-gradient(transparent 233px, rgba(255,255,255,.22) 233px, rgba(255,255,255,.22) 234px, transparent 234px, transparent 466px, rgba(255,255,255,.22) 466px, rgba(255,255,255,.22) 467px, transparent 467px)"></div>
  <div class="scrim-t"></div>

  <div style="position: absolute; top: 54px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between">
    <a href="Home.html" class="ib g" aria-label="Close camera"><svg class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></a>
    <div class="glass" style="display: flex; align-items: center; gap: 2px; padding: 0 6px; height: 44px; border-radius: 22px">
      <button class="ib" aria-label="Flash auto" style="width: 40px; color: #FFD60A"><svg class="i s" viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg></button>
      <button class="ib" aria-label="Timer off" style="width: 40px"><svg class="i s" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M9 2h6"></path></svg></button>
      <button aria-label="Format" style="height: 28px; padding: 0 8px; border-radius: 8px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.14)">HEIF · 48MP</button>
      <button aria-label="Apple ProRAW on" style="height: 28px; padding: 0 8px; border-radius: 8px; font-size: 11px; font-weight: 700; background: #FFD60A; color: #000; margin-left: 4px">RAW</button>
      <button class="ib" aria-label="Aspect ratio 4:3" style="width: 44px; font-size: 12px; font-weight: 700">4:3</button>
    </div>
    <a href="CameraPro.html" class="ib g" aria-label="Pro settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
  </div>

  <div style="position: absolute; top: 110px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: flex-start">
    <div class="hist" aria-label="Histogram"><i style="height: 20%"></i><i style="height: 32%"></i><i style="height: 48%"></i><i style="height: 60%"></i><i style="height: 72%"></i><i style="height: 66%"></i><i style="height: 58%"></i><i style="height: 70%"></i><i style="height: 88%"></i><i style="height: 96%"></i><i style="height: 80%"></i><i style="height: 62%"></i><i style="height: 44%"></i><i style="height: 30%"></i><i style="height: 18%"></i><i style="height: 10%"></i></div>
    <span class="badge" style="height: 26px; font-family: 'JetBrains Mono', monospace; font-weight: 500">AE/AF LOCK</span>
  </div>

  <div style="position: absolute; left: 112px; top: 334px; width: 72px; height: 2px; background: rgba(255,255,255,.85)"></div>
  <div style="position: absolute; left: 206px; top: 334px; width: 72px; height: 2px; background: rgba(255,255,255,.85)"></div>
  <div style="position: absolute; left: 190px; top: 331px; width: 10px; height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px #32D74B" aria-label="Level: straight"></div>

  <div style="position: absolute; left: 132px; top: 196px; width: 104px; height: 104px; box-shadow: inset 0 0 0 1.5px #FFD60A" aria-label="Focus point locked on face"></div>
  <div style="position: absolute; left: 246px; top: 186px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFD60A">
    <svg class="i xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"></path></svg>
    <div style="width: 2px; height: 46px; background: #FFD60A; opacity: .7"></div>
    <div style="width: 2px; height: 46px; background: #FFD60A; opacity: .3"></div>
    <span class="mono" style="font-size: 10px">+0.3</span>
  </div>

  <div class="scrim-b"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 214px; display: flex; justify-content: center; gap: 6px">
    <span class="badge mono" style="font-weight: 500">ISO 125</span><span class="badge mono" style="font-weight: 500">1/250</span><span class="badge mono" style="font-weight: 500">5200K</span><span class="badge mono" style="font-weight: 500">ƒ1.78</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 156px; display: flex; justify-content: center">
    <div class="lens" role="group" aria-label="Lens"><span>.5</span><span class="on">1×</span><span>2</span><span>5</span></div>
  </div>
  <div class="modes" style="position: absolute; left: 0; right: 0; bottom: 124px">
    <span>Video</span><span class="on">Photo</span><span>Portrait</span><span>Pro</span>
  </div>
  <div style="position: absolute; left: 28px; right: 28px; bottom: 34px; display: flex; align-items: center; justify-content: space-between">
    <a href="Library.html" aria-label="Last capture" style="width: 52px; height: 52px; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.7)"><img src="../assets/img/hiker.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover"></a>
    <button class="shutter" aria-label="Take photo"><i></i></button>
    <button class="ib g" aria-label="Switch to front camera" style="width: 52px; height: 52px"><svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path><path d="M3 21v-5h5"></path></svg></button>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
