<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera — Video recording</title>
<link rel="stylesheet" href="../mova.css">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}</style>
<div class="scr" style="background: #000">
  <img src="../assets/img/road.jpg" alt="Live preview: desert road at dusk" style="position: absolute; left: 0; top: 0; width: 390px; height: 720px; object-fit: cover">
  <div aria-label="Zebra: highlights near clipping" style="position: absolute; left: 150px; top: 70px; width: 120px; height: 90px; border-radius: 40px; background: repeating-linear-gradient(45deg, rgba(255,255,255,.55) 0 3px, transparent 3px 8px); -webkit-mask: radial-gradient(closest-side, #000 60%, transparent); mask: radial-gradient(closest-side, #000 60%, transparent)"></div>
  <div style="position: absolute; left: 20px; right: 20px; top: 150px; bottom: 300px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25)" aria-label="16:9 frame guide"></div>
  <div class="scrim-t"></div>

  <div style="position: absolute; top: 54px; left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between">
    <div class="glass" style="display: flex; gap: 6px; align-items: center; height: 36px; padding: 0 10px; border-radius: 18px; font-size: 11px; font-weight: 700">
      <span>4K</span><span style="opacity: .5">·</span><span>24</span><span style="opacity: .5">·</span><span>HEVC</span><span style="opacity: .5">·</span><span style="color: #FFD60A">LOG</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 18px; background: #FF453A; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500" aria-label="Recording, 1 minute 24 seconds">
      <span style="width: 8px; height: 8px; border-radius: 50%; background: #fff"></span>00:01:24
    </div>
    <div class="glass" style="height: 36px; padding: 0 10px; border-radius: 18px; display: flex; align-items: center; font-size: 11px; font-weight: 600">≈ 2h 06m</div>
  </div>

  <div style="position: absolute; top: 104px; left: 12px; display: flex; flex-direction: column; gap: 6px">
    <div class="glass" style="padding: 8px 10px; border-radius: 12px; width: 132px">
      <div class="row2" style="gap: 6px; font-size: 10px; font-weight: 600; color: #A9A9B3"><svg class="i xs" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>USB-C mic</div>
      <div style="margin-top: 6px; display: flex; flex-direction: column; gap: 4px">
        <div style="height: 4px; border-radius: 2px; background: linear-gradient(90deg, #32D74B 0 60%, #FFD60A 60% 74%, rgba(255,255,255,.15) 74%)"></div>
        <div style="height: 4px; border-radius: 2px; background: linear-gradient(90deg, #32D74B 0 55%, #FFD60A 55% 66%, rgba(255,255,255,.15) 66%)"></div>
      </div>
      <div class="mono" style="margin-top: 5px; font-size: 9px; color: #A9A9B3; display: flex; justify-content: space-between"><span>-24</span><span>-12</span><span>-6</span><span>0</span></div>
    </div>
  </div>
  <div style="position: absolute; top: 104px; right: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end">
    <span class="badge" style="height: 26px">Zebra 95%</span>
    <span class="badge" style="height: 26px">Peaking</span>
    <span class="badge" style="height: 26px">Stab · Standard</span>
  </div>

  <div class="scrim-b"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 214px; display: flex; justify-content: center; gap: 6px">
    <span class="badge mono" style="font-weight: 500">ISO 400</span><span class="badge mono" style="font-weight: 500">180°</span><span class="badge mono" style="font-weight: 500">WB 4300K</span><span class="badge mono" style="font-weight: 500">MF 2.4m</span>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 156px; display: flex; justify-content: center">
    <div class="lens" role="group" aria-label="Lens"><span>.5</span><span class="on">1×</span><span>2</span><span>5</span></div>
  </div>
  <div class="modes" style="position: absolute; left: 0; right: 0; bottom: 124px">
    <span class="on">Video</span><span>Photo</span><span>Cinematic</span><span>Slo-mo</span>
  </div>
  <div style="position: absolute; left: 28px; right: 28px; bottom: 34px; display: flex; align-items: center; justify-content: space-between">
    <button class="ib g" aria-label="Pause recording" style="width: 52px; height: 52px"><svg class="i" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"></path></svg></button>
    <button class="shutter r" aria-label="Stop recording"><i></i></button>
    <button aria-label="Capture still photo while recording" style="width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 2px #fff; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 40px; border-radius: 50%; background: #fff"></span></button>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
