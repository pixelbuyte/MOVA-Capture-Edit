<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}</style>
<div class="scr safe">
  <div class="nav">

  <div class="pad" style="margin-top: 16px">
    <div class="m" style="height: 330px; border-radius: 20px; box-shadow: 0 0 0 2px #8F7FFF">
      <img src="../assets/img/fashion_dress.jpg" alt="Reference video preview: summer dress walk by the sea">
      <span class="badge tag" style="background: #5B47F0; left: 12px; top: 12px">REFERENCE</span>
      <button class="ib g" aria-label="Play reference" style="position: absolute; left: 50%; top: 50%; margin: -28px 0 0 -28px; width: 56px; height: 56px"><svg class="i f" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg></button>
      <div style="position: absolute; left: 12px; right: 12px; bottom: 12px">

        <div class="mono" style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: #fff"><span>0:04</span><span>0:12</span></div>
      </div>
    </div>
    <div class="xs" style="margin-top: 8px; display: flex; justify-content: space-between"><span>From Photos · 1080×1920 · 30 fps · 0:12</span><a href="RefImport.html" class="acc" style="font-weight: 600">Replace</a></div>
  </div>

  <div class="pad" style="margin-top: 16px">
    <div class="cap">Or choose from</div>

      <button class="card" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 600"><svg class="i s" viewBox="0 0 24 24"><rect x="3" y="7" width="14" height="14" rx="2"></rect><path d="M7 3h12a2 2 0 0 1 2 2v12"></path></svg>Library</button>
      <button class="card" style="height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 11px; font-weight: 600"><svg class="i s" viewBox="0 0 24 24"><path d="M4 6a2 2 0 0 1 2-2h4l2 2h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path></svg>Files</button>
