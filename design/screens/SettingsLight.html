<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera preferences — light appearance</title>
<link rel="stylesheet" href="../mova.css">
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}</style>
<div class="scr light safe">
  <div class="nav">
    <a href="Profile.html" class="ib e" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span class="ttl">Camera</span>
    <span class="ib"></span>
  </div>

  <div class="pad" style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px">
    <div class="cap" style="padding-left: 4px">Appearance</div>
    <div class="seg" style="background: #E4E4EA"><span>System</span><span>Dark</span><span class="on" style="background: #fff">Light</span></div>

    <div class="cap" style="padding-left: 4px; margin-top: 14px">Photo</div>
    <div class="list">
      <div class="row"><span>Format</span><span class="v"><span class="seg" style="width: 150px; padding: 2px; background: #ECECF0"><span class="on" style="background: #fff; height: 28px; line-height: 28px">HEIF</span><span style="height: 28px; line-height: 28px">JPEG</span></span></span></div>
      <div class="row"><span>Apple ProRAW</span><span class="v">48MP<span class="tog on"></span></span></div>
      <div class="row"><span>Portrait depth</span><span class="v"><span class="tog on"></span></span></div>
      <div class="row"><span>Mirror front camera</span><span class="v"><span class="tog"></span></span></div>
    </div>

    <div class="cap" style="padding-left: 4px; margin-top: 14px">Video</div>
    <div class="list">
      <div class="row"><span>Default</span><span class="v">4K · 24 fps · HEVC<svg class="i xs" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg></span></div>
      <div class="row"><span>Apple Log</span><span class="v"><span class="tog on"></span></span></div>
      <div class="row" style="min-height: 60px"><span style="color: #6A6A73">ProRes<div class="xs" style="margin-top: 2px">Not available on this iPhone</div></span><span class="v"><span class="tog" style="opacity: .4"></span></span></div>
    </div>

    <div class="cap" style="padding-left: 4px; margin-top: 14px">Capture</div>
    <div class="list">
      <div class="row"><span>Keep last mode &amp; lens</span><span class="v"><span class="tog on"></span></span></div>
      <div class="row"><span>Grid &amp; level</span><span class="v"><span class="tog on"></span></span></div>
      <div class="row"><span>Also save to Photos</span><span class="v"><span class="tog on"></span></span></div>
    </div>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
