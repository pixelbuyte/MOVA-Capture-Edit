<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Review direction</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .board { grid-template-columns: 3fr 4fr 5fr; margin: var(--sp-4) var(--gutter) 0; align-items: start; }
  .board__frame { height: 168px; }
  .board__meta { margin-top: var(--sp-2); }
  .board__meta .tc { display: block; }
  .board__meta .caption { display: block; margin-top: 2px; color: var(--text-2); }
  .specs { margin: var(--sp-5) var(--gutter) 0; }
  .spec { display: flex; align-items: center; justify-content: space-between; min-height: 48px; box-shadow: inset 0 -1px 0 var(--hairline); }
  .spec:first-child { box-shadow: inset 0 1px 0 var(--hairline), inset 0 -1px 0 var(--hairline); }
  .picker__opt { font-size: var(--t-callout); }
  .pro { font: 600 9px/1 var(--font-ui); letter-spacing: var(--track-caps); color: var(--accent); vertical-align: super; margin-left: 2px; }
  .meter { display: flex; align-items: center; gap: var(--sp-2); }
  .meter__bar { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-4); position: relative; overflow: hidden; }
  .meter__bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 85%; background: var(--text-2); border-radius: 2px; }
  .meter__bar b { position: absolute; top: 0; bottom: 0; left: 85%; width: 15%; background: var(--accent); }
</style>
</head>
<body>
<main class="screen top">
  <div class="flowhead">
    <a class="ibtn" href="direction.html" aria-label="Back"><svg class="ic" aria-hidden="true"><use href="../icons.svg#back"/></svg></a>
    <div class="flowsteps" role="img" aria-label="Step 5 of 6"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i><i></i></div>
    <span></span>
  </div>
  <div class="pad" style="margin-top: var(--sp-2)">
    <h1 class="title1">Your version, shot by shot</h1>
    <p class="body" style="margin-top: var(--sp-1)">Preview frames. The video will be generated new from your photo.</p>
  </div>

  <div class="board">
    <figure style="margin: 0">
      <div class="board__frame"><img src="../img/port_smile.jpg" alt="Shot 1 preview: close-up of you, warm backlight" style="object-position: 50% 25%; filter: sepia(.3) saturate(1.15) contrast(1.08) brightness(.95)"><span class="board__glyph"><svg class="ic ic--xs" aria-hidden="true"><use href="../icons.svg#pushin"/></svg></span></div>
      <figcaption class="board__meta"><span class="tc">1 · 3.0 s</span><span class="caption">Push-in, turn</span></figcaption>
    </figure>
    <figure style="margin: 0">
      <div class="board__frame"><img src="../img/port_smile.jpg" alt="Shot 2 preview: medium shot walking, side light" style="object-position: 85% 40%; transform: scaleX(-1) scale(1.35); filter: sepia(.32) saturate(1.1) brightness(.82)"><span style="position: absolute; inset: 0; background: linear-gradient(90deg, var(--glow-warm), transparent 60%)" aria-hidden="true"></span><span class="board__glyph"><svg class="ic ic--xs" aria-hidden="true"><use href="../icons.svg#track"/></svg></span></div>
      <figcaption class="board__meta"><span class="tc">2 · 4.0 s</span><span class="caption">Track, walk</span></figcaption>
    </figure>
    <figure style="margin: 0">
      <div class="board__frame"><img src="../img/beach.jpg" alt="Shot 3 preview: wide coastline at golden hour, you small in frame" style="filter: sepia(.25) saturate(1.1)"><span class="board__glyph"><svg class="ic ic--xs" aria-hidden="true"><use href="../icons.svg#crane"/></svg></span></div>
      <figcaption class="board__meta"><span class="tc">3 · 5.0 s</span><span class="caption">Crane out, wide</span></figcaption>
    </figure>
  </div>

  <div class="pad" style="margin-top: var(--sp-4)">
    <div class="field">
      <svg class="ic ic--sm t-accent" aria-hidden="true" style="margin-top: 2px"><use href="../icons.svg#spark"/></svg>
      <span style="font-size: var(--t-callout); line-height: var(--lh-callout)">Keep my shirt. Warmer, more cinematic light.</span>
    </div>
  </div>

  <div class="specs">
    <div class="spec"><span class="callout t-1">Length</span>
      <div class="picker" role="radiogroup" aria-label="Length" data-choice><button class="picker__opt" role="radio" data-opt aria-checked="false">6 s</button><button class="picker__opt" role="radio" data-opt aria-checked="true">12 s</button><button class="picker__opt" role="radio" data-opt aria-checked="false">20 s</button></div></div>
    <div class="spec"><span class="callout t-1">Aspect</span>
      <div class="picker" role="radiogroup" aria-label="Aspect ratio" data-choice><button class="picker__opt" role="radio" data-opt aria-checked="true">9:16</button><button class="picker__opt" role="radio" data-opt aria-checked="false">1:1</button><button class="picker__opt" role="radio" data-opt aria-checked="false">16:9</button></div></div>
    <div class="spec"><span class="callout t-1">Quality</span>
      <div class="picker" role="radiogroup" aria-label="Quality" data-choice><button class="picker__opt" role="radio" data-opt aria-checked="true">1080p</button><button class="picker__opt" role="radio" data-opt aria-checked="false">4K<span class="pro">PRO</span></button></div></div>
  </div>

  <div class="actionbar" style="flex-direction: column; align-items: stretch; gap: var(--sp-3)">
    <div class="meter" aria-label="Uses 36 of your 240 credits, 204 left">
      <span class="tc t-1">36 credits</span>
      <div class="meter__bar" aria-hidden="true"><i></i><b></b></div>
      <span class="tc">204 left</span>
    </div>
    <a class="btn btn--ai" href="generating.html"><svg class="ic ic--sm" aria-hidden="true"><use href="../icons.svg#spark"/></svg>Generate my version</a>
    <span class="caption" style="text-align: center">Usually 2–4 min. Credits come back if it fails.</span>
  </div>
  <div class="home-indicator"></div>
</main>
<script src="../proto.js"></script>
</body>
</html>
