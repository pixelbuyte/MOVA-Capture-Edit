<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Not enough credits</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .behind { position: absolute; inset: 0; opacity: .35; }
  .behind img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.3); }
  .gap { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-4); }
  .gap__bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-4); position: relative; }
  .gap__bar i { position: absolute; inset: 0 auto 0 0; width: 55%; background: var(--text-2); border-radius: 3px; }
  .gap__bar b { position: absolute; top: -4px; bottom: -4px; left: 100%; width: 2px; background: var(--accent); }
  .opt { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--sp-3); min-height: 64px; box-shadow: inset 0 -1px 0 var(--hairline); text-align: left; width: 100%; }
  .opt small { display: block; font-size: var(--t-caption); color: var(--text-3); margin-top: 2px; }
</style>
</head>
<body>
<main class="screen screen--media">
  <div class="behind"><img src="../img/port_smile.jpg" alt=""></div>
  <section class="sheet" style="padding-top: var(--sp-2)" role="dialog" aria-labelledby="nc-t">
    <div class="sheet__grabber"></div>
    <h2 class="title2" id="nc-t">This needs 36 credits</h2>
    <p class="body" style="margin-top: var(--sp-1)">You have 20. Nothing has been charged.</p>
    <div class="gap" role="img" aria-label="20 of 36 credits"><span class="tc t-1">20</span><div class="gap__bar"><i></i><b></b></div><span class="tc">36</span></div>
    <div style="margin-top: var(--sp-4)">
      <a class="opt" href="review.html"><span>Make it 6 seconds<small>Same direction, shots 1 and 3 only</small></span><span class="tc t-1">18 cr</span></a>
      <a class="opt" href="subscription.html"><span>Top up 100 credits<small>Packs never expire</small></span><span class="tc">[PRICE]</span></a>
      <a class="opt" href="subscription.html"><span>MOVA Pro<small>500 credits every month</small></span><svg class="ic ic--sm t-3" aria-hidden="true"><use href="../icons.svg#chev"/></svg></a>
    </div>
    <button class="btn btn--plain" style="width: 100%; margin-top: var(--sp-3); color: var(--text-2)">Save draft for later</button>
  </section>
  <div class="home-indicator"></div>
</main>
</body>
</html>
