<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Empty Library</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .sheetgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 228px; margin: 0 auto; }
  .sheetgrid i { aspect-ratio: 3 / 4; border-radius: var(--r-1); box-shadow: inset 0 0 0 1px var(--hairline-strong); position: relative; }
  .sheetgrid i::after { content: attr(data-n); position: absolute; left: 5px; bottom: 4px; font: 500 8.5px/1 var(--font-mono); color: var(--text-3); }
  .sheetgrid i.one { box-shadow: none; background: var(--surface-3); display: grid; place-items: center; }
</style>
</head>
<body>
<main class="screen top">
  <div class="pad row" style="height: 44px"><h1 class="title1">Library</h1></div>
  <div style="margin-top: 96px">
    <div class="sheetgrid" aria-hidden="true">
      <i data-n="01" class="one"><span style="width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface-1), 0 0 0 3.5px var(--select); background: var(--select)"></span></i><i data-n="02"></i><i data-n="03"></i><i data-n="04"></i><i data-n="05"></i><i data-n="06"></i>
    </div>
  </div>
  <div class="pad" style="text-align: center; margin-top: var(--sp-8)">
    <h2 class="display" style="font-size: 32px; line-height: 36px">Frame one starts here.</h2>
    <p class="body" style="margin: var(--sp-3) auto 0; max-width: 290px">Photos and videos you shoot, import or make with MOVA collect here.</p>
  </div>
  <div class="pad" style="display: grid; gap: var(--sp-2); margin-top: var(--sp-6)">
    <a class="btn btn--primary" href="camera.html">Open camera</a>
    <button class="btn btn--secondary">Import from Photos</button>
  </div>
  <nav class="tabbar" aria-label="Main">
    <div class="tabbar__tabs">
      <a href="home.html"><svg class="ic" aria-hidden="true"><use href="../icons.svg#home"/></svg>Home</a>
      <a href="discover.html"><svg class="ic" aria-hidden="true"><use href="../icons.svg#discover"/></svg>Discover</a>
      <a href="ref-import.html"><svg class="ic" aria-hidden="true"><use href="../icons.svg#studio"/></svg>Studio</a>
      <a href="library.html" aria-current="page"><svg class="ic" aria-hidden="true"><use href="../icons.svg#library"/></svg>Library</a>
    </div>
    <a class="tabbar__shutter" href="camera.html" aria-label="Open camera"><span></span></a>
  </nav>
  <div class="home-indicator"></div>
</main>
</body>
</html>
