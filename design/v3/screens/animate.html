<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Animate a photo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/semantic.css">
<link rel="stylesheet" href="../tokens/component.css">
<link rel="stylesheet" href="../components.css">
<style>
  .photo { position: relative; height: 330px; margin: var(--sp-4) var(--gutter) 0; border-radius: var(--r-4); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; animation: orbit 5s var(--ease-standard) infinite alternate; }
  .photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .motions { display: flex; gap: var(--sp-3); padding-left: var(--gutter); margin-top: var(--sp-3); overflow: hidden; }
  .mo { width: 72px; flex: none; text-align: left; }
  .mo__img { height: 72px; border-radius: var(--r-2); overflow: hidden; }
  .mo__img img { width: 100%; height: 100%; object-fit: cover; }
  .mo__name { margin-top: var(--sp-2); font: 500 var(--t-caption)/1.25 var(--font-ui); color: var(--text-2); }
  .mo[aria-checked="true"] .mo__name { color: var(--text-1); }
  .mo[aria-disabled="true"] { opacity: .4; }
  .mo .vf::after { inset: -4px; }
  @keyframes orbit { from { transform: scale(1.12) translateX(-4%) rotate(-1deg); } to { transform: scale(1.12) translateX(4%) rotate(1deg); } }
  @keyframes zoom { from { transform: scale(1); } to { transform: scale(1.25); } }
  @keyframes drift { from { transform: scale(1.2) translateY(4%); } to { transform: scale(1.2) translateY(-4%); } }
  @keyframes reveal { 0% { clip-path: inset(0 0 100% 0); } 60%, 100% { clip-path: inset(0); } }
  @keyframes wind { 0%, 100% { transform: scale(1.1) skewX(0); } 50% { transform: scale(1.1) skewX(2deg); } }
  .a-orbit { animation: orbit 2.4s ease-in-out infinite alternate; } .a-zoom { animation: zoom 2.4s ease-in-out infinite alternate; }
  .a-drift { animation: drift 2.4s ease-in-out infinite alternate; } .a-reveal { animation: reveal 2.4s ease-out infinite; } .a-wind { animation: wind 1.6s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .photo img, [class^="a-"] { animation: none !important; } }
</style>
</head>
<body>
<main class="screen top">
  <div class="navbar">
    <a class="ibtn" href="home.html" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="../icons.svg#close"/></svg></a>
    <div class="navbar__title">Animate</div>
    <a class="credits" href="subscription.html" aria-label="240 credits" style="justify-self: end"><svg class="ic" aria-hidden="true"><use href="../icons.svg#credit"/></svg>240</a>
  </div>

  <div class="photo">
    <img src="../img/dog.jpg" alt="Your photo: a beagle, previewing a camera orbit">
    <svg viewBox="0 0 350 330" aria-hidden="true"><ellipse cx="175" cy="210" rx="140" ry="34" fill="none" stroke="var(--text-1)" stroke-width="1.5" stroke-dasharray="4 6" opacity=".8"/><path d="m306 222 10-4-3 11" fill="none" stroke="var(--text-1)" stroke-width="1.5" stroke-linecap="round"/></svg>
    <span class="src src--yours src--chip" style="position: absolute; left: var(--sp-3); top: var(--sp-3)">Your photo</span>
    <span class="tc" style="position: absolute; right: var(--sp-3); top: var(--sp-3); padding: 4px 7px; border-radius: 6px; background: var(--overlay); color: var(--text-1)">Motion preview</span>
  </div>

  <div class="pad row row--between" style="margin-top: var(--sp-5)"><h2 class="headline">Motion</h2><span class="caption">Previews use your photo</span></div>
  <div class="motions" role="radiogroup" aria-label="Motion" data-choice>
    <button class="mo" role="radio" data-opt aria-checked="true"><div class="mo__img vf" aria-checked="true"><img class="a-orbit" src="../img/dog.jpg" alt=""></div><div class="mo__name">Orbit</div></button>
    <button class="mo" role="radio" data-opt aria-checked="false"><div class="mo__img"><img class="a-zoom" src="../img/dog.jpg" alt=""></div><div class="mo__name">Slow zoom</div></button>
    <button class="mo" role="radio" data-opt aria-checked="false"><div class="mo__img"><img class="a-wind" src="../img/dog.jpg" alt=""></div><div class="mo__name">Natural</div></button>
    <button class="mo" role="radio" data-opt aria-checked="false"><div class="mo__img"><img class="a-drift" src="../img/dog.jpg" alt=""></div><div class="mo__name">Drift</div></button>
    <button class="mo" role="radio" data-opt aria-checked="false" aria-disabled="true" aria-label="Talking portrait, needs a human face"><div class="mo__img"><img src="../img/dog.jpg" alt=""></div><div class="mo__name">Talking · needs a face</div></button>
  </div>

  <div class="pad" style="margin-top: var(--sp-4)">
    <div class="field field--placeholder"><svg class="ic ic--sm t-accent" aria-hidden="true" style="margin-top: 2px"><use href="../icons.svg#spark"/></svg><span style="font-size: var(--t-callout)">Optional: ears catch the wind, golden light…</span></div>
  </div>

  <div class="actionbar" style="flex-direction: column; align-items: stretch; gap: var(--sp-3)">
    <div class="row row--between">
      <div class="picker" role="radiogroup" aria-label="Length" data-choice><button class="picker__opt" role="radio" data-opt aria-checked="true">5 s</button><button class="picker__opt" role="radio" data-opt aria-checked="false">8 s</button></div>
      <span class="tc">9:16 · 1080p</span>
    </div>
    <a class="btn btn--ai" href="generating.html"><svg class="ic ic--sm" aria-hidden="true"><use href="../icons.svg#spark"/></svg>Animate <span class="btn__cost">· 18 cr</span></a>
  </div>
  <div class="home-indicator"></div>
</main>
<script src="../proto.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="../motion.js"></script>
</body>
</html>
