<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · How recreation works</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/semantic.css">
<link rel="stylesheet" href="../tokens/component.css">
<link rel="stylesheet" href="../components.css">
<style>
  .stage { position: relative; height: 470px; margin-top: var(--sp-4); }
  .card { position: absolute; border-radius: var(--r-3); overflow: hidden; box-shadow: var(--shadow-float); }
  .card img { width: 100%; height: 100%; object-fit: cover; }
  .card .src { position: absolute; left: var(--sp-2); top: var(--sp-2); }
  .ref { left: 26px; top: 40px; width: 132px; height: 200px; transform: rotate(-6deg); }
  .you { right: 26px; top: 60px; width: 132px; height: 200px; transform: rotate(5deg); }
  .out { left: 50%; top: 150px; width: 200px; height: 300px; margin-left: -100px; opacity: 0; }
  .out .wipe { position: absolute; inset: 0; }
  .plus { position: absolute; left: 50%; top: 130px; margin-left: -14px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); display: grid; place-items: center; color: var(--text-2); }
  .tags { position: absolute; left: 0; right: 0; bottom: var(--sp-3); display: flex; justify-content: center; gap: var(--sp-2); }
  .tags span { white-space: nowrap; font: 500 var(--t-micro)/1 var(--font-ui); color: var(--on-media); padding: 5px 7px; border-radius: 6px; background: var(--overlay); opacity: 0; }
  .dots { display: flex; gap: 6px; margin-top: var(--sp-5); }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-4); }
  .dots i.on { width: 20px; background: var(--text-1); }
</style>
</head>
<body>
<main class="screen top">
  <div class="stage" role="img" aria-label="A reference video and your photo combine into a new video of you with the reference's camera moves and light">
    <div class="card ref"><img src="../img/fashion_dress.jpg" alt="" style="object-position: 50% 30%"><span class="src src--ref src--chip">Reference</span></div>
    <span class="plus" aria-hidden="true"><svg class="ic ic--sm"><use href="../icons.svg#plus"/></svg></span>
    <div class="card you"><img src="../img/port_smile.jpg" alt="" style="object-position: 50% 25%"><span class="src src--yours src--chip">You</span></div>
    <div class="card out">
      <div class="wipe" style="--x: 0%">
        <img src="../img/port_smile.jpg" alt="" style="object-position: 50% 25%; filter: sepia(.32) saturate(1.2) contrast(1.08)">
        <div class="wipe__top"><img src="../img/port_smile.jpg" alt="" style="object-position: 50% 25%"></div>
        <div class="wipe__bar"></div>
      </div>
      <div class="tags"><span>Push-in</span><span>Warm light</span><span>Slow</span></div>
    </div>
  </div>
  <div class="pad">
    <h1 class="title1">Pick a video you love.<br>Add yourself.</h1>
    <p class="body" style="margin-top: var(--sp-2)">MOVA learns its camera moves, light and pacing, then makes a new video starring you. Not a filter.</p>
    <div class="dots" aria-label="Page 2 of 3"><i></i><i class="on"></i><i></i></div>
  </div>
  <div class="actionbar"><a class="btn btn--primary" href="onboard-camera.html">Continue</a></div>
  <div class="home-indicator"></div>
</main>
<script>
  (window.movaTimelines = window.movaTimelines || []).push((A) => {
    const tl = A.timeline({ loop: true, easing: 'cubicBezier(.2,.8,.2,1)' });
    tl.add({ targets: '.ref', translateX: [-60, 0], opacity: [0, 1], rotate: [-14, -6], duration: 700 })
      .add({ targets: '.you', translateX: [60, 0], opacity: [0, 1], rotate: [12, 5], duration: 700 }, '-=450')
      .add({ targets: '.plus', scale: [0, 1], duration: 400 }, '-=300')
      .add({ targets: ['.ref', '.you'], translateY: [0, -14], scale: [1, .92], opacity: [1, .55], duration: 600 }, '+=500')
      .add({ targets: '.out', opacity: [0, 1], translateY: [24, 0], scale: [.94, 1], duration: 700 }, '-=400')
      .add({ targets: { x: 0 }, x: 100, duration: 1300, easing: 'easeInOutSine', update: a => document.querySelector('.out .wipe').style.setProperty('--x', a.animations[0].currentValue + '%') })
      .add({ targets: '.tags span', opacity: [0, 1], translateY: [6, 0], delay: A.stagger(120), duration: 400 })
      .add({ targets: ['.out', '.ref', '.you', '.plus'], opacity: 0, duration: 500 }, '+=1800');
  });
</script>
<script src="../proto.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="../motion.js"></script>
</body>
</html>
