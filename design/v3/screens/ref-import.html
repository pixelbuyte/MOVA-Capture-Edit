<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Choose a reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/semantic.css">
<link rel="stylesheet" href="../tokens/component.css">
<link rel="stylesheet" href="../components.css">
<style>
  .player { position: relative; height: 372px; margin: var(--sp-4) var(--gutter) 0; border-radius: var(--r-4); overflow: hidden; }
  .player img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 35%; }
  .player__play { position: absolute; left: 50%; top: 50%; margin: -30px 0 0 -30px; width: 60px; height: 60px; }
  .trim { position: relative; margin: var(--sp-4) var(--gutter) 0; }
  .trim .filmstrip { height: 52px; border-radius: var(--r-2); }
  .trim__sel { position: absolute; top: -3px; height: 58px; left: 0; right: 22%; border-radius: var(--r-2); box-shadow: inset 0 0 0 2px var(--select); }
  .trim__dim { position: absolute; top: 0; height: 52px; right: 0; width: 22%; background: var(--overlay); border-radius: 0 var(--r-2) var(--r-2) 0; }
  .trim__h { position: absolute; top: 0; bottom: 0; width: 14px; background: var(--select); display: grid; place-items: center; }
  .trim__h::after { content: ""; width: 2px; height: 16px; border-radius: 1px; background: var(--on-select); opacity: .5; }
  .trim__h--l { left: 0; border-radius: var(--r-2) 0 0 var(--r-2); }
  .trim__h--r { right: 0; border-radius: 0 var(--r-2) var(--r-2) 0; }
  .sources { display: grid; grid-template-columns: repeat(4, 1fr); margin: var(--sp-5) var(--gutter) 0; }
  .sources button { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: var(--sp-2) 0; font: 500 var(--t-caption)/1 var(--font-ui); color: var(--text-2); min-height: 56px; }
  .sources button + button { box-shadow: inset 1px 0 0 var(--hairline); }
</style>
</head>
<body>
<main class="screen top">
  <div class="flowhead">
    <a class="ibtn" href="home.html" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="../icons.svg#close"/></svg></a>
    <div class="flowsteps" role="img" aria-label="Step 1 of 6"><i class="now"></i><i></i><i></i><i></i><i></i><i></i></div>
    <span></span>
  </div>
  <div class="pad" style="margin-top: var(--sp-2)">
    <h1 class="title1">Choose a reference</h1>
    <p class="body" style="margin-top: var(--sp-1)">The video whose look and movement you want.</p>
  </div>

  <div class="player">
    <img src="../img/fashion_dress.jpg" alt="Reference video: a summer dress walk by the sea">
    <span class="src src--ref src--chip" style="position: absolute; left: var(--sp-3); top: var(--sp-3)">Reference</span>
    <span class="tc" style="position: absolute; right: var(--sp-3); top: var(--sp-3); padding: 4px 7px; border-radius: 6px; background: var(--overlay); color: var(--text-1)">1080 × 1920 · 30 fps</span>
    <button class="ibtn ibtn--glass player__play" data-playtoggle aria-pressed="false" aria-label="Play"><svg class="ic ic--lg" aria-hidden="true"><use href="../icons.svg#play"/></svg></button>
  </div>

  <div class="trim" role="group" aria-label="Choose the part to recreate">
    <div class="filmstrip" aria-hidden="true">
      <div style="background-image: url(../img/fashion_dress.jpg); background-position: 50% 15%"></div>
      <div style="background-image: url(../img/fashion_dress.jpg); background-position: 50% 45%"></div>
      <div style="background-image: url(../img/fashion_dress.jpg); background-position: 50% 80%"></div>
      <div style="background-image: url(../img/beach.jpg)"></div>
      <div style="background-image: url(../img/beach.jpg); background-position: 70% 50%"></div>
      <div style="background-image: url(../img/sea_clouds.jpg)"></div>
      <div style="background-image: url(../img/sea_clouds.jpg); background-position: 80% 50%"></div>
    </div>
    <div class="trim__dim" aria-hidden="true"></div>
    <div class="trim__sel">
      <button class="trim__h trim__h--l" aria-label="Start 0:00"></button>
      <button class="trim__h trim__h--r" aria-label="End 0:12"></button>
    </div>
    <div class="ruler-tc"><span class="tc">0:00</span><span class="tc t-1">Recreating 0:00 – 0:12</span><span class="tc">0:15</span></div>
  </div>

  <div class="sources" role="group" aria-label="Other sources">
    <button><svg class="ic" aria-hidden="true"><use href="../icons.svg#photo"/></svg>Photos</button>
    <button><svg class="ic" aria-hidden="true"><use href="../icons.svg#library"/></svg>Library</button>
    <button><svg class="ic" aria-hidden="true"><use href="../icons.svg#folder"/></svg>Files</button>
    <button><svg class="ic" aria-hidden="true"><use href="../icons.svg#camera"/></svg>Captures</button>
  </div>

  <div class="actionbar" style="flex-direction: column; gap: var(--sp-2)">
    <a class="btn btn--primary" href="ref-analysis.html">Analyze 12 seconds</a>
    <span class="caption">Analysis is free and takes about 20 seconds. Use videos you made or have rights to.</span>
  </div>
  <div class="home-indicator"></div>
</main>
<script src="../proto.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="../motion.js"></script>
</body>
</html>
