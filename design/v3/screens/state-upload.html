<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Upload interrupted</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/semantic.css">
<link rel="stylesheet" href="../tokens/component.css">
<link rel="stylesheet" href="../components.css">
<style>
  .photo { position: relative; height: 300px; margin: var(--sp-5) var(--gutter) 0; border-radius: var(--r-4); overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .photo .sent { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: var(--overlay); -webkit-backdrop-filter: grayscale(1) blur(2px); backdrop-filter: grayscale(1) blur(2px); }
  .photo .edge { position: absolute; left: 0; right: 0; bottom: 40%; height: 2px; background: var(--caution); }
  .bar { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-4) var(--gutter) 0; }
  .bar__track { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-4); position: relative; overflow: hidden; }
  .bar__track i { position: absolute; inset: 0 auto 0 0; width: 60%; background: var(--caution); border-radius: 2px; }
  .facts { margin: var(--sp-5) var(--gutter) 0; }
</style>
</head>
<body>
<main class="screen top">
  <div class="flowhead">
    <a class="ibtn" href="select-media.html" aria-label="Back to your media"><svg class="ic" aria-hidden="true"><use href="../icons.svg#back"/></svg></a>
    <div class="flowsteps" role="img" aria-label="Step 5 of 6"><i class="done"></i><i class="done"></i><i class="done"></i><i class="done"></i><i class="now"></i><i></i></div>
    <span></span>
  </div>
  <div class="pad" style="margin-top: var(--sp-2)" data-enter>
    <h1 class="title1">Upload paused</h1>
    <p class="body" style="margin-top: var(--sp-1)">Your Wi-Fi dropped while sending your photo. Nothing has been generated yet.</p>
  </div>
  <div class="photo" role="img" aria-label="Your photo, 6.2 of 10.4 MB sent">
    <img src="../img/port_smile.jpg" alt="">
    <div class="sent"></div><div class="edge"></div>
    <span class="src src--yours src--chip" style="position: absolute; left: var(--sp-3); top: var(--sp-3)">Your photo</span>
  </div>
  <div class="bar" aria-hidden="true"><span class="tc t-1">6.2 MB</span><div class="bar__track"><i></i></div><span class="tc">10.4 MB</span></div>
  <dl class="readout facts">
    <dt>Credits</dt><dd><svg class="ic ic--xs" style="color: var(--positive)" aria-hidden="true"><use href="../icons.svg#check"/></svg>Not charged · still 240</dd>
    <dt>Direction</dt><dd>Saved as a draft</dd>
    <dt>Next</dt><dd>Resumes from 6.2 MB, not the start</dd>
  </dl>
  <div class="actionbar" style="flex-direction: column; gap: var(--sp-1)">
    <button class="btn btn--primary"><svg class="ic ic--sm" aria-hidden="true"><use href="../icons.svg#refresh"/></svg>Resume upload</button>
    <a class="btn btn--plain" href="home.html" style="width: 100%; color: var(--text-2)">Finish later on Wi-Fi</a>
  </div>
  <div class="home-indicator"></div>
</main>
<script src="../proto.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="../motion.js"></script>
</body>
</html>
