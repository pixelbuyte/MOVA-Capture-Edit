<style>
  .viewer { height: 300px; display: grid; place-items: center; background: var(--canvas); margin-top: var(--sp-1); }
  .viewer__frame { position: relative; width: 169px; height: 300px; overflow: hidden; }
  .viewer__frame img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.12) saturate(1.08); }
  .title-ov { position: absolute; left: 0; right: 0; bottom: 64px; text-align: center; font: 400 22px/1 var(--font-display); }
  .cap-ov { position: absolute; left: 10px; right: 10px; bottom: 26px; text-align: center; font: 600 11px/1.3 var(--font-ui); }
  .cap-ov span { background: var(--overlay); padding: 2px 4px; border-radius: 3px; }
  .transport { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: var(--sp-2) var(--sp-4); }
  .tl { position: relative; background: var(--surface-1); padding: var(--sp-2) 0 0; overflow: hidden; height: 236px; }
  .ticks { display: flex; padding-left: 36px; height: 18px; }
  .ticks span { width: 80px; flex: none; font: 500 11px/1 var(--font-mono); color: var(--text-3); }
  .track { display: flex; align-items: center; gap: var(--sp-2); height: 30px; margin-top: 6px; }
  .track > b { width: 28px; flex: none; text-align: right; font: 600 11px/1 var(--font-mono); color: var(--text-3); }
  .lanebody { position: relative; flex: 1; height: 100%; display: flex; gap: 3px; }
  .blk { height: 100%; border-radius: 5px; display: flex; align-items: center; padding: 0 7px; font: 500 11px/1 var(--font-ui); color: var(--text-1); white-space: nowrap; overflow: hidden; flex: none; }
  .blk--title { background: var(--surface-4); }
  .blk--cc { background: var(--surface-3); color: var(--text-2); }
  .track--v { height: 52px; }
  .clip { position: relative; height: 100%; border-radius: 5px; overflow: hidden; flex: none; display: flex; }
  .clip img { height: 100%; width: 52px; object-fit: cover; flex: none; }
  .clip--sel { box-shadow: 0 0 0 2px var(--select); z-index: 2; overflow: visible; }
  .clip--sel::before, .clip--sel::after { content: ""; position: absolute; top: 0; bottom: 0; width: 10px; background: var(--select); z-index: 3; }
  .clip--sel::before { left: -2px; border-radius: 5px 0 0 5px; } .clip--sel::after { right: -2px; border-radius: 0 5px 5px 0; }
  .speed { position: absolute; right: 14px; bottom: 4px; font: 600 11px/1 var(--font-mono); padding: 2px 4px; border-radius: 3px; background: var(--overlay); z-index: 4; }
  .xfade { position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px; border-radius: 5px; background: var(--select); color: var(--on-select); display: grid; place-items: center; z-index: 5; }
  .wave { height: 100%; border-radius: 5px; background: var(--surface-2); flex: none; overflow: hidden; position: relative; }
  .wave svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .wave span { position: absolute; left: 6px; top: 4px; font: 500 11px/1 var(--font-ui); color: var(--text-2); }
  .tl .playhead { left: 190px; top: 22px; bottom: 0; }
  .ctx { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--sp-2) var(--sp-2) calc(var(--safe-bottom) + 2px); background: var(--surface-2); border-radius: var(--r-4) var(--r-4) 0 0; }
  .ctx__tools { display: flex; justify-content: space-between; }
  .ctx__tools a, .ctx__tools button { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 52px; padding: 6px 0; font: 500 11px/1 var(--font-ui); color: var(--text-2); }
</style>
