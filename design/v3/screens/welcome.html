<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>MOVA · Welcome</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@400..700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="../tokens/primitives.css">
<link rel="stylesheet" href="../tokens/semantic.css">
<link rel="stylesheet" href="../tokens/component.css">
<link rel="stylesheet" href="../components.css">
<style>
  .reel { position: absolute; inset: 0; }
  .reel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
  .reel img:first-child { opacity: 1; }
  .shade { position: absolute; inset: 0; background: linear-gradient(var(--overlay), transparent 30%, transparent 40%, var(--canvas) 78%); }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .copy { position: absolute; left: var(--gutter); right: var(--gutter); bottom: 190px; }
  .dots { display: flex; gap: 6px; margin-top: var(--sp-6); }
  .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--surface-4); }
  .dots i.on { width: 20px; background: var(--text-1); }
</style>
</head>
<body>
<main class="screen screen--media">
  <div class="reel" aria-hidden="true">
    <img src="../img/port_smile.jpg" alt="" style="object-position: 50% 25%; filter: sepia(.3) saturate(1.15)">
    <img src="../img/porsche.jpg" alt="">
    <img src="../img/dog.jpg" alt="">
  </div>
  <div class="shade"></div>
  <div class="fx" data-fireflies="16"></div>

  <div style="position: absolute; top: calc(var(--safe-top) + var(--sp-4)); left: var(--gutter)">
    <svg viewBox="0 0 64 64" width="36" height="36" fill="none" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="MOVA" data-draw="200"><path d="M14 46V20l18 18 18-18v26" stroke="var(--accent)" stroke-width="6" opacity=".7" transform="translate(5 5)"/><path d="M14 46V20l18 18 18-18v26" stroke="var(--text-1)" stroke-width="6"/></svg>
  </div>

  <div class="copy">
    <h1 class="display" style="font-size: 48px; line-height: 48px" data-enter>Show it a video.<br>Make it yours.</h1>
    <p class="body" style="margin-top: var(--sp-4); color: var(--text-1); opacity: .8" data-enter>A pro camera, an editor, and a studio that recreates any video's look and movement with you in it.</p>
    <div class="dots" aria-label="Page 1 of 3" data-enter><i class="on"></i><i></i><i></i></div>
  </div>
  <div class="actionbar" style="background: none; flex-direction: column; gap: var(--sp-1)">
    <a class="btn btn--primary" href="onboard-recreate.html" data-enter>Get started</a>
    <a class="btn btn--plain" href="home.html" style="width: 100%; color: var(--text-2)" data-enter>I already have an account</a>
  </div>
  <div class="home-indicator"></div>
</main>
<script>
  // Crossfade reel: three looks from MOVA, 3.2 s each
  (window.movaTimelines = window.movaTimelines || []).push((A) => {
    const imgs = document.querySelectorAll('.reel img');
    // Later images stack on top. Fade 1 in, fade 2 in, then hide 1 and fade 2 out to reveal 0. Loop.
    A.timeline({ loop: true, easing: 'easeInOutSine' })
      .add({ targets: imgs[1], opacity: [0, 1], duration: 900 }, 2400)
      .add({ targets: imgs[2], opacity: [0, 1], duration: 900 }, 5600)
      .add({ targets: imgs[1], opacity: 0, duration: 1 }, 8800)
      .add({ targets: imgs[2], opacity: 0, duration: 900 }, 8800)
      .add({ targets: {}, duration: 1500 });
  });
</script>
<script src="../proto.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="../motion.js"></script>
</body>
</html>
