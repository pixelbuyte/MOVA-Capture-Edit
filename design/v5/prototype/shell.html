<title>MOVA Prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}html,body{margin:0;background:#F4EEE3}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ───────── Prototype chrome (same board language as the screen files) ───────── */
  .mv{
    --ink:#0E1116; --ink-2:#1B2028; --paper:#F4EEE3; --coral:#FF5A36; --mint:#3DF0A8;
    --display:"Bricolage Grotesque",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,monospace;
    --s:1;
    box-sizing:border-box;min-height:100vh;min-height:100dvh;width:100%;overflow:hidden;position:relative;
    background:var(--paper);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased;
    display:grid;grid-template-columns:236px auto 236px;justify-content:center;align-items:stretch;gap:72px;padding:32px 24px;
  }
  .mv *,.mv *::before,.mv *::after{box-sizing:border-box}
  .mv-col{display:flex;flex-direction:column;min-width:0;padding:8px 0;max-height:calc(100dvh - 64px);position:relative;z-index:1}
  .mv-brand{font-weight:800;font-size:28px;letter-spacing:-.02em;font-variation-settings:"opsz" 96;display:flex;align-items:center;gap:10px}
  .mv-brand i{width:14px;height:14px;border-radius:50%;background:var(--coral);display:block}
  .mv-eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(14,17,22,.56)}
  .mv-now{margin-top:28px}
  .mv-now h1{margin:10px 0 0;font-weight:700;font-size:36px;text-wrap:balance;line-height:1;letter-spacing:-.03em;font-variation-settings:"opsz" 96}
  .mv-list{list-style:none;margin:24px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
  .mv-list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:10px;
    font-family:var(--display);font-size:15px;font-weight:500;color:rgba(14,17,22,.68);transition:background .15s,color .15s;white-space:nowrap;overflow:hidden}
  .mv-list button b{font-weight:inherit;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .mv-list button span{font-family:var(--mono);font-size:12px;color:rgba(14,17,22,.44);width:18px;flex:none}
  .mv-list button::after{content:"";flex:none;margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--coral);opacity:0;transition:opacity .15s}
  .mv-list button:hover{background:rgba(14,17,22,.06);color:var(--ink)}
  .mv-list button:focus-visible,.mv-btn:focus-visible,.mv-toggle:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .mv-list button[aria-current="true"]{background:var(--ink);color:#fff;font-weight:600}
  .mv-list button[aria-current="true"] span{color:rgba(255,255,255,.6)}
  .mv-list button[aria-current="true"]::after{opacity:1}
  .mv-col.r{justify-content:center;gap:28px}
  .mv-note{padding-left:16px;border-left:2px solid rgba(14,17,22,.14)}
  .mv-note.c{border-color:var(--coral)}
  .mv-note h3{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .mv-note p{margin:4px 0 0;font-size:14px;line-height:1.4;color:rgba(14,17,22,.68)}
  .mv-note kbd{font-family:var(--mono);font-size:12px;padding:1px 6px;border-radius:6px;background:rgba(14,17,22,.08)}
  .mv-toggle{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:15px;font-weight:600;margin-top:10px}
  .mv-toggle i{width:40px;height:24px;border-radius:12px;background:rgba(14,17,22,.18);position:relative;transition:background .15s;flex:none}
  .mv-toggle i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:translate .15s;box-shadow:0 1px 3px rgba(14,17,22,.3)}
  .mv-toggle[aria-pressed="true"] i{background:var(--ink)}
  .mv-toggle[aria-pressed="true"] i::after{translate:16px 0}
  .mv-row{display:flex;gap:8px;margin-top:10px}
  .mv-btn{all:unset;box-sizing:border-box;cursor:pointer;height:36px;padding:0 14px;border-radius:18px;font-family:var(--display);font-size:14px;font-weight:600;
    box-shadow:inset 0 0 0 1.5px rgba(14,17,22,.22);transition:background .15s,scale .12s}
  .mv-btn:hover{background:rgba(14,17,22,.06)} .mv-btn:active{scale:.96}

  /* ───────── Phone (frame copied from the boards) ───────── */
  .mv-stage{position:relative;align-self:center;width:calc(414px*var(--s));height:calc(868px*var(--s))}
  .mv-disc{position:absolute;left:50%;top:50%;width:calc(560px*var(--s));height:calc(560px*var(--s));margin:calc(-280px*var(--s)) 0 0 calc(-280px*var(--s));border-radius:50%;background:var(--coral)}
  .mv-phone{position:absolute;left:0;top:0;width:414px;height:868px;border-radius:66px;background:#0A0B0D;padding:12px;
    transform:scale(var(--s));transform-origin:0 0;
    box-shadow:0 0 0 1.5px #2E3138, inset 0 0 0 1.5px #3B3F47, 0 50px 90px -30px rgba(60,20,8,.55), 0 18px 36px -12px rgba(14,17,22,.35)}
  .mv-view{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:var(--ink);isolation:isolate}
  .mv-scr{position:absolute;inset:0;display:block;visibility:hidden;font-family:var(--display);color:var(--ink);-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  .mv-scr.is-on{visibility:visible;z-index:1}
  .mv-scr.is-in{visibility:visible;z-index:2}
  .mv-toast{position:absolute;left:16px;right:16px;top:64px;z-index:5;height:56px;border-radius:20px;padding:0 8px 0 16px;display:flex;align-items:center;gap:10px;
    background:rgba(14,17,22,.82);border:1px solid rgba(255,255,255,.14);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
    color:#fff;font-size:15px;font-weight:600;letter-spacing:-.01em;opacity:0;translate:0 -12px;pointer-events:none;transition:opacity .22s,translate .22s}
  .mv-toast.is-on{opacity:1;translate:0 0;pointer-events:auto}
  .mv-toast svg{width:20px;height:20px;fill:var(--mint);flex:none}
  .mv-toast button{all:unset;cursor:pointer;margin-left:auto;height:40px;padding:0 14px;border-radius:14px;background:rgba(255,255,255,.12);font-size:14px;font-weight:600}
  .mv-toast button:active{scale:.96}

  @media (max-width:1040px){
    .mv{display:flex;align-items:center;justify-content:center;padding:0}
    .mv-col,.mv-disc{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .mv *, .mv *::after{transition:none!important}
  }
</style>
<!--@HEAD-END-->
<div class="mv" id="mv">
  <aside class="mv-col l" aria-label="Screens">
    <div class="mv-brand"><i></i>MOVA</div>
    <div class="mv-now">
      <div class="mv-eyebrow" id="mv-eyebrow">Prototype</div>
      <h1 id="mv-title">Welcome</h1>
    </div>
    <ol class="mv-list" id="mv-list"></ol>
  </aside>

  <div class="mv-stage">
    <div class="mv-disc"></div>
    <div class="mv-phone">
      <div class="mv-view" id="mv-view">
        <div class="mv-toast" id="mv-toast" role="status" aria-live="polite">
          <svg viewBox="0 0 256 256" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/></svg>
          <span id="mv-toast-text">Saved to Photos</span>
          <button type="button" id="mv-toast-btn">Back to Studio</button>
        </div>
      </div>
    </div>
  </div>

  <aside class="mv-col r" aria-label="Prototype controls">
    <div class="mv-note c">
      <h3>Clickable prototype</h3>
      <p>Tap the real controls in the phone to move through the recreate flow.</p>
      <button type="button" class="mv-toggle" id="mv-hs" aria-pressed="false"><i></i>Show hotspots</button>
    </div>
    <div class="mv-note">
      <h3>Step through</h3>
      <p><kbd>←</kbd> <kbd>→</kbd> walk the screens in flow order.</p>
      <div class="mv-row">
        <button type="button" class="mv-btn" id="mv-prev">Previous</button>
        <button type="button" class="mv-btn" id="mv-next">Next</button>
      </div>
    </div>
    <div class="mv-note">
      <h3>Link a screen</h3>
      <p>Every screen has its own address, for example <kbd id="mv-hash">#02-welcome</kbd>.</p>
      <div class="mv-row"><button type="button" class="mv-btn" id="mv-restart">Restart</button></div>
    </div>
  </aside>
</div>

<!--@SCREENS-->
<!--@REGISTRY-->
<!--@IMG-->
<script>
(function(){
  'use strict';
  var REG = JSON.parse(document.getElementById('mova-registry').textContent);
  var IMG = window.MOVA_IMG || null;                 // single-file build: name -> data URI
  var SCRIPTS = window.MOVA_SCRIPTS || {};
  var root = document.getElementById('mv'), view = document.getElementById('mv-view');
  var toast = document.getElementById('mv-toast');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)');
  var byId = {}, ORDER = REG.order, current = null, busy = false, trail = [], timers = [];

  /* Added to every screen's shadow root: host defaults the boards took from the page body, plus hotspot affordances. */
  var SHARED =
    ':host{font-family:var(--display);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:normal}' +
    '.hs{cursor:pointer;transition:scale .12s ease,opacity .12s ease;-webkit-tap-highlight-color:transparent}' +
    '.hs:active{scale:.97;opacity:.86}' +
    '.hs:focus-visible{outline:2px solid #fff;outline-offset:2px}' +
    ':host(.show-hs) .hs,:host(.flash-hs) .hs{outline:2px dashed #3DF0A8;outline-offset:2px;box-shadow:0 0 0 4px rgba(61,240,168,.22)}' +
    ':host(.flash-hs) .hs{animation:hsflash .9s ease both}' +
    '@keyframes hsflash{0%,60%{outline-color:#3DF0A8}100%{outline-color:transparent;box-shadow:0 0 0 4px rgba(61,240,168,0)}}' +
    /* 01 camera: recording state */
    '.shutter i{transition:left .2s,top .2s,width .2s,height .2s,border-radius .2s}' +
    '.shutter.rec i{left:26px;top:26px;width:28px;height:28px;border-radius:8px}' +
    '.shutter.rec svg circle:first-child{animation:recpulse .8s ease-in-out infinite alternate}' +
    '@keyframes recpulse{to{opacity:.45}}' +
    /* 08 export: saved state */
    '.save.saved{background:var(--ink-2);color:#fff;box-shadow:inset 0 0 0 1px var(--hair)}.save.saved svg{fill:var(--mint)}' +
    '@media (prefers-reduced-motion:reduce){.hs,.shutter i{transition:none}.shutter.rec svg circle:first-child,:host(.flash-hs) .hs{animation:none}}';

  /* ── custom behaviours, referenced from screens.json as "action" ── */
  var ACTIONS = {
    record: function(s, el, h){
      if (el.classList.contains('rec')) return;
      var small = s.shadow.querySelector('.bar .title small'), keep = small && small.innerHTML, t0 = Date.now();
      el.classList.add('rec'); el.setAttribute('aria-label', 'Stop recording');
      var tick = setInterval(function(){
        if (small) small.innerHTML = '<b>Rec</b> · ' + ((Date.now() - t0) / 1000).toFixed(1) + 's';
      }, 100);
      var done = setTimeout(function(){ s.reset(); go(h.to, 'push'); }, 1600);
      timers.push(tick, done);
      s.reset = function(){
        clearInterval(tick); clearTimeout(done);
        el.classList.remove('rec'); el.setAttribute('aria-label', 'Record shot 1');
        if (small) small.innerHTML = keep;
        s.reset = null;
      };
    },
    look: function(s, el){
      var f = el.querySelector('i').style.filter || 'none';
      s.shadow.querySelectorAll('.preview img, .tl .clip i').forEach(function(n){ n.style.filter = f; });
      s.shadow.querySelectorAll('.rail .lk').forEach(function(n){ n.classList.toggle('on', n === el); });
      var pill = s.shadow.querySelector('.lookpill'); if (pill) pill.textContent = el.querySelector('small').textContent;
    },
    toggle: function(s, el){                       // settings switches
      var on = el.classList.toggle('on'); el.setAttribute('aria-checked', on);
    },
    select: function(s, el, h){                    // radio-style rows
      s.shadow.querySelectorAll(h.sel).forEach(function(n){
        n.classList.toggle('on', n === el); n.setAttribute('aria-checked', n === el);
      });
    },
    save: function(s, el, h, rendered){
      if (el.classList.contains('saved')) { go(h.to, 'pop'); return; }
      var via = byId[h.via];
      if (via && !rendered) {                      // pass through the Exporting screen, then come back saved
        go(via.id, 'fade');
        var t = setTimeout(function(){
          via.reset = null; busy = false; go(s.id, 'fade');
          ACTIONS.save(s, el, h, true);
        }, 1900);
        via.reset = function(){ clearTimeout(t); via.reset = null; };
        return;
      }
      var label = el.lastChild, keep = label.textContent;
      el.classList.add('saved'); label.textContent = 'Saved to Photos';
      toast.classList.add('is-on');
      var hide = setTimeout(function(){ toast.classList.remove('is-on'); }, 4000);
      document.getElementById('mv-toast-btn').onclick = function(){ go(h.to, 'pop'); };
      s.reset = function(){ clearTimeout(hide); el.classList.remove('saved'); label.textContent = keep; toast.classList.remove('is-on'); s.reset = null; };
    }
  };

  /* ── mount every screen in its own shadow root ── */
  REG.screens.forEach(function(s){
    byId[s.id] = s;
    var tpl = document.querySelector('template[data-screen="' + s.id + '"]');
    var html = tpl.innerHTML;
    if (IMG) html = html.replace(/\.\.\/\.\.\/v3\/img\/([\w.\-]+)/g, function(m, n){ return IMG[n] || m; });
    var host = document.createElement('div');
    host.className = 'mv-scr'; host.dataset.id = s.id; host.setAttribute('aria-hidden', 'true');
    s.host = host; s.shadow = host.attachShadow({mode: 'open'});
    s.shadow.innerHTML = html + '<style>' + SHARED + '</style>';
    view.insertBefore(host, toast);
    if (SCRIPTS[s.id]) { try { SCRIPTS[s.id](s.shadow); } catch (e) { console.error(s.id, e); } }
  });

  /* ── hotspots ── */
  REG.screens.forEach(function(s){
    (s.hotspots || []).forEach(function(h){
      if (h.to && h.to !== '@back' && !byId[h.to]) return;      // target screen not designed yet
      s.shadow.querySelectorAll(h.sel).forEach(function(el){
        if (el.classList.contains('hs')) return;
        el.classList.add('hs'); el.setAttribute('role', 'button'); el.tabIndex = 0;
        var fire = function(ev){
          ev.stopPropagation();
          if (h.action) ACTIONS[h.action](s, el, h);
          else if (h.to === '@back') back(h.fallback, h.fx);
          else go(h.to, h.fx || 'push');
        };
        el.addEventListener('click', fire);
        el.addEventListener('keydown', function(ev){ if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fire(ev); } });
      });
    });
    /* a tap that hits nothing flashes what is tappable */
    s.host.addEventListener('click', function(){
      s.host.classList.remove('flash-hs'); void s.host.offsetWidth; s.host.classList.add('flash-hs');
      setTimeout(function(){ s.host.classList.remove('flash-hs'); }, 950);
    });
  });

  /* ── navigation ── */
  function back(fallback, fx){
    var prev = trail.length > 1 ? trail[trail.length - 2] : (fallback || REG.start);
    if (trail.length > 1) trail.length -= 2;
    go(prev, fx || 'pop');
  }
  function go(id, fx, fromHash){
    var next = byId[id];
    if (!next || busy || next === current) return;
    var prev = current; current = next;
    if (prev && prev.reset) prev.reset();
    trail.push(id); if (trail.length > 50) trail.shift();
    paint();
    if (!fromHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { try { location.hash = id; } catch (e2) {} } }
    var done = function(){
      if (prev) { prev.host.classList.remove('is-on'); prev.host.setAttribute('aria-hidden', 'true'); }
      next.host.classList.remove('is-in'); next.host.classList.add('is-on'); next.host.removeAttribute('aria-hidden');
      busy = false;
    };
    if (!prev || (reduce && reduce.matches) || !next.host.animate) { done(); return; }
    busy = true; next.host.classList.add('is-in');
    var o = {duration: 260, easing: 'cubic-bezier(.22,.8,.24,1)', fill: 'both'}, a, b;
    if (fx === 'fade') {
      a = next.host.animate([{opacity: 0}, {opacity: 1}], o);
    } else if (fx === 'pop') {
      prev.host.style.zIndex = 3;
      a = prev.host.animate([{transform: 'translateX(0)'}, {transform: 'translateX(100%)'}], o);
      b = next.host.animate([{transform: 'translateX(-24%)', opacity: .6}, {transform: 'translateX(0)', opacity: 1}], o);
    } else {
      a = next.host.animate([{transform: 'translateX(100%)'}, {transform: 'translateX(0)'}], o);
      b = prev.host.animate([{transform: 'translateX(0)', opacity: 1}, {transform: 'translateX(-24%)', opacity: .6}], o);
    }
    var fin = function(){ [a, b].forEach(function(x){ if (x) x.cancel(); }); prev.host.style.zIndex = ''; done(); };
    a.onfinish = fin; a.oncancel = function(){ if (busy) fin(); };
    setTimeout(function(){ if (busy) fin(); }, 600);            // safety net (background tabs)
  }
  function step(d){
    var i = ORDER.indexOf(current.id), n = ORDER[i + d];
    if (n) go(n, d > 0 ? 'push' : 'pop');
  }

  /* ── side stepper ── */
  var list = document.getElementById('mv-list'), btns = {};
  ORDER.forEach(function(id){
    var s = byId[id], li = document.createElement('li'), b = document.createElement('button');
    b.type = 'button'; b.innerHTML = '<span>' + s.num + '</span>'; var nm = document.createElement('b'); nm.textContent = s.name; b.appendChild(nm); b.title = s.name;
    b.addEventListener('click', function(){ go(id, ORDER.indexOf(id) < ORDER.indexOf(current.id) ? 'pop' : 'push'); });
    li.appendChild(b); list.appendChild(li); btns[id] = b;
  });
  function paint(){
    document.getElementById('mv-eyebrow').textContent = 'Screen ' + current.num + ' · ' + (ORDER.indexOf(current.id) + 1) + ' of ' + ORDER.length;
    document.getElementById('mv-title').textContent = current.name;
    document.getElementById('mv-hash').textContent = '#' + current.id;
    for (var k in btns) btns[k].setAttribute('aria-current', k === current.id ? 'true' : 'false');
    if (btns[current.id].scrollIntoView && list.scrollHeight > list.clientHeight) btns[current.id].scrollIntoView({block: 'nearest'});
  }

  /* ── controls ── */
  var hsBtn = document.getElementById('mv-hs');
  hsBtn.addEventListener('click', function(){
    var on = hsBtn.getAttribute('aria-pressed') !== 'true';
    hsBtn.setAttribute('aria-pressed', on);
    REG.screens.forEach(function(s){ s.host.classList.toggle('show-hs', on); });
  });
  document.getElementById('mv-prev').addEventListener('click', function(){ step(-1); });
  document.getElementById('mv-next').addEventListener('click', function(){ step(1); });
  document.getElementById('mv-restart').addEventListener('click', function(){ trail = []; go(REG.start, 'fade'); });
  document.addEventListener('keydown', function(ev){
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (ev.key === 'ArrowRight') { ev.preventDefault(); step(1); }
    else if (ev.key === 'ArrowLeft') { ev.preventDefault(); step(-1); }
    else if (ev.key === 'h' || ev.key === 'H') hsBtn.click();
  });
  window.addEventListener('hashchange', function(){
    var id = location.hash.slice(1); if (byId[id]) go(id, 'fade', true);
  });

  /* ── fit the phone to the viewport ── */
  function fit(){
    var w = document.documentElement.clientWidth || window.innerWidth, h = window.innerHeight;
    var narrow = w <= 1040, pad = narrow ? 16 : 64;
    var s = Math.min(1, (h - pad) / 868, narrow ? (w - pad) / 414 : 1);
    root.style.setProperty('--s', Math.max(.3, s).toFixed(4));
  }
  window.addEventListener('resize', fit); fit();

  var first = ''; try { first = location.hash.slice(1); } catch (e) {}
  go(byId[first] ? first : REG.start, null, true);
  window.MOVA = {go: go, step: step, screens: byId, order: ORDER};
})();
</script>
