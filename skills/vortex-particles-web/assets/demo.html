<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Vortex for the web · demo</title>
<style>body{margin:0;background:#0B0B0B;color:#EDEAE3;font:14px system-ui;padding:24px}.g{display:grid;grid-template-columns:repeat(5,200px);gap:16px}.c{position:relative;height:260px;border-radius:16px;background:#141414;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%}span{position:absolute;left:12px;bottom:10px}</style></head><body><div class="g" id="g"></div>
<script src="vortex.js"></script><script>
['spark','fireflies','magic','smoke','confetti'].forEach(n=>{const d=document.createElement('div');d.className='c';d.innerHTML=`<canvas></canvas><span>${n}</span>`;document.getElementById('g').appendChild(d);
const o={spark:{position:[.5,.75]},fireflies:{},magic:{},smoke:{position:[.5,1]},confetti:{position:[.5,.2]}}[n];const v=Vortex.mount(d.querySelector('canvas'),Vortex.presets[n](o));if(n==='confetti'){v.burst(80);setInterval(()=>v.burst(80),2500)}});
</script></body></html>
